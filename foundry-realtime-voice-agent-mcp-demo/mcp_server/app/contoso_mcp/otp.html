<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contoso Bank | Demo OTP console</title>
  <style>
    body { font: 16px system-ui, sans-serif; background: #f2f5fa; color: #17243b; margin: 0; }
    main { max-width: 760px; margin: 40px auto; padding: 32px; background: white; border-radius: 12px; }
    h1 { color: #123b77; } label { display: block; margin-top: 20px; font-weight: 600; }
    input, select, button { font: inherit; padding: 12px; margin: 8px 0; max-width: 100%; box-sizing: border-box; }
    input, select { width: 100%; } button { background: #123b77; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; } #status { white-space: pre-wrap; }
    #code { font-size: 2rem; letter-spacing: .15em; } .notice { background: #fff5d6; padding: 16px; }
    [hidden] { display: none !important; }
  </style>
  <script src="/otp.js" defer></script>
</head>
<body>
  <main>
    <h1>Contoso Bank demo OTP console</h1>
    <p class="notice">Fictional data only. These codes authenticate a demonstration, not a bank account.
      Officer selection is random and transfers are simulated.</p>
    <section id="unlock">
      <label for="key">Administrator access key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false">
      <button id="unlock-button" type="button">Unlock directory</button>
    </section>
    <section id="directory" hidden>
      <label for="customer">Fictional customer</label>
      <select id="customer"></select>
      <pre id="profile"></pre>
      <button id="generate" type="button">Generate customer OTP</button>
      <p id="code"></p>
      <p id="expiry"></p>
      <p id="permanent"></p>
      <button id="lock" type="button">Lock console</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
